<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Order</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Pizza Order System</h1>
    <p>Call us or chat with the assistant.</p>

    <div class="actions">
      <!-- Replace with your real Vapi phone number -->
      <a class="call-btn" href="tel:+1234567890">Call to Order</a>
    </div>

    <div class="chat-box">
      <h2>Chat</h2>
      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="message-input"
          placeholder="Ask about menu, prices, or place an order..."
          required
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");

    let customerKey = localStorage.getItem("customer_key");
    if (!customerKey) {
      customerKey = "web-" + crypto.randomUUID();
      localStorage.setItem("customer_key", customerKey);
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      messageInput.value = "";

      try {
        const res = await fetch("/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            customer_key: customerKey,
            message: message,
            channel: "chat"
          })
        });

        const data = await res.json();
        addMessage("assistant", data.reply || "Sorry, I couldn't respond.");
      } catch (err) {
        addMessage("assistant", "Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
