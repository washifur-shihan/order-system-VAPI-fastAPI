<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Order</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>{{ restaurant.name }}</h1>
<p>{{ restaurant.welcome_message or "Call us or chat with the assistant." }}</p>


    <div class="chat-box">
      <h2>Chat</h2>
      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="message-input"
          placeholder="Ask about menu, prices, or place an order..."
          required
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const voiceMessagesDiv = document.getElementById("voice-messages");

    let customerKey = localStorage.getItem("customer_key");
    if (!customerKey) {
      customerKey = "web-" + crypto.randomUUID();
      localStorage.setItem("customer_key", customerKey);
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addVoiceMessage(role, text) {
      if (!text) return;

      const div = document.createElement("div");
      div.className = `message ${role === "assistant" ? "assistant" : "user"}`;
      div.innerText = text;
      voiceMessagesDiv.appendChild(div);
      voiceMessagesDiv.scrollTop = voiceMessagesDiv.scrollHeight;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      messageInput.value = "";

      try {
        const res = await fetch("/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
  restaurant_id: "{{ restaurant.id }}",
  customer_key: customerKey,
  message: message,
  channel: "chat"
})
        });

        const data = await res.json();
        addMessage("assistant", data.reply || "Sorry, I couldn't respond.");
      } catch (err) {
        addMessage("assistant", "Something went wrong. Please try again.");
      }
    });
  </script>

  <script src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js" async type="text/javascript"></script>

  <vapi-widget
    id="pizza-vapi-widget"
    public-key="44abeb8a-b2af-4459-96a7-5bf1467dcbd1"
    assistant-id="7ef1e73f-24e4-433d-a29c-2bc65333a6e6"
    mode="voice"
    theme="light"
    size="compact"
    main-label="Call to Order"
    start-button-text="Start Call"
    end-button-text="End Call"
    empty-voice-message="Tap to start talking"
  ></vapi-widget>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const startBtn = document.getElementById("start-call-btn");
      const widget = document.querySelector("vapi-widget");
      let lastTranscript = "";

      if (startBtn && widget) {
        startBtn.addEventListener("click", function () {
          widget.shadowRoot?.querySelector("button")?.click();
        });
      }

      if (widget) {
        widget.addEventListener("call-start", function () {
          console.log("Voice call started");
          voiceMessagesDiv.innerHTML = "";
          lastTranscript = "";
        });

        widget.addEventListener("call-end", function () {
          console.log("Voice call ended");
        });

        widget.addEventListener("message", function (event) {
          const message = event.detail;
          console.log("Widget message:", message);

          if (message?.type === "transcript") {
            const transcriptText = message.transcript || "";
            const transcriptRole = message.role || "assistant";
            const key = `${transcriptRole}:${transcriptText}`;

            if (transcriptText && key !== lastTranscript) {
              addVoiceMessage(transcriptRole, transcriptText);
              lastTranscript = key;
            }
          }
        });

        widget.addEventListener("error", function (event) {
          console.error("Widget error:", event.detail);
        });
      }
    });
  </script>
</body>
</html>
