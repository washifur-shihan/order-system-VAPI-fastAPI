<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Order</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Pizza Order System</h1>
    <p>Call us or chat with the assistant.</p>

    <div class="actions">
  <button class="call-btn" id="start-call-btn" type="button">Call to Order</button>
  <p class="small-note">Starts a browser voice call using your microphone.</p>
</div>

<div class="actions">
  <button class="call-btn" id="start-call-btn" type="button">Call to Order</button>
  <p class="small-note">Starts a browser voice call using your microphone.</p>
</div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");

    let customerKey = localStorage.getItem("customer_key");
    if (!customerKey) {
      customerKey = "web-" + crypto.randomUUID();
      localStorage.setItem("customer_key", customerKey);
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      messageInput.value = "";

      try {
        const res = await fetch("/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            customer_key: customerKey,
            message: message,
            channel: "chat"
          })
        });

        const data = await res.json();
        addMessage("assistant", data.reply || "Sorry, I couldn't respond.");
      } catch (err) {
        addMessage("assistant", "Something went wrong. Please try again.");
      }
    });
  </script>

  <script src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js" async type="text/javascript"></script>
  
  <vapi-widget
  id="pizza-vapi-widget"
  public-key="44abeb8a-b2af-4459-96a7-5bf1467dcbd1"
  assistant-id="7ef1e73f-24e4-433d-a29c-2bc65333a6e6"
  mode="voice"
  theme="light"
  size="compact"
  main-label="Call to Order"
  start-button-text="Start Call"
  end-button-text="End Call"
  empty-voice-message="Tap to start talking"
></vapi-widget>


 <script>
  document.addEventListener("DOMContentLoaded", function () {
    const widget = document.querySelector("vapi-widget");
    const startBtn = document.getElementById("start-call-btn");
    const messagesDiv = document.getElementById("messages");

    function addMessage(role, text) {
      if (!text || !messagesDiv) return;

      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function clearMessages() {
      if (messagesDiv) {
        messagesDiv.innerHTML = "";
      }
    }

    if (startBtn && widget) {
      startBtn.addEventListener("click", function () {
        clearMessages();

        // tries to open/start the widget voice call
        const internalButton = widget.shadowRoot?.querySelector("button");
        if (internalButton) {
          internalButton.click();
        } else {
          console.warn("Widget button not found yet.");
        }
      });
    }

    if (widget) {
      widget.addEventListener("call-start", function () {
        addMessage("assistant", "Call started. You can speak now.");
      });

      widget.addEventListener("call-end", function () {
        addMessage("assistant", "Call ended.");
      });

      widget.addEventListener("message", function (event) {
        console.log("Widget message:", event.detail);

        const msg = event.detail;

        if (!msg) return;

        // Try common structures safely
        const role =
          msg.role ||
          msg.message?.role ||
          msg.sender ||
          "assistant";

        const content =
          msg.content ||
          msg.message?.content ||
          msg.transcript ||
          msg.text ||
          "";

        if (!content) return;

        if (role === "user") {
          addMessage("user", content);
        } else {
          addMessage("assistant", content);
        }
      });

      widget.addEventListener("error", function (event) {
        console.error("Widget error:", event.detail);
        addMessage("assistant", "There was a call error. Please try again.");
      });
    }
  });
</script>

</body>
</html>
